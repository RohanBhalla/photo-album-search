<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photo Album Search</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <h1>Photo Album</h1>
    <p class="tagline">Search your photos in plain English: "dogs", "show me cats and trees"</p>
  </header>

  <main>
    <!-- Search -->
    <section class="card">
      <form id="search-form" class="search-row" autocomplete="off">
        <input id="search-input" type="search" placeholder="Try &quot;show me dogs and cats&quot;" aria-label="Search photos" required>
        <button type="submit">Search</button>
      </form>
      <p id="search-status" class="status" role="status"></p>
    </section>

    <section id="results" class="grid" aria-live="polite"></section>

    <!-- Upload -->
    <section class="card">
      <h2>Upload a photo</h2>
      <form id="upload-form">
        <label class="field">
          <span>Photo (JPEG or PNG, up to 10 MB)</span>
          <input id="upload-file" type="file" accept="image/jpeg,image/png" required>
        </label>
        <label class="field">
          <span>Custom labels (optional): press Enter or comma after each</span>
          <div id="tag-box" class="tag-box">
            <input id="tag-input" type="text" placeholder="e.g. Sam" aria-label="Add a custom label">
          </div>
        </label>
        <button type="submit" id="upload-button">Upload</button>
      </form>
      <p id="upload-status" class="status" role="status"></p>
    </section>
  </main>

  <!-- API Gateway generated SDK (SDK1): load order from frontend/sdk/README.md -->
  <script src="sdk/lib/axios/dist/axios.standalone.js"></script>
  <script src="sdk/lib/CryptoJS/rollups/crypto-js.js"></script>
  <script src="sdk/lib/CryptoJS/rollups/sha256.js"></script>
  <script src="sdk/lib/CryptoJS/components/hmac.js"></script>
  <script src="sdk/lib/CryptoJS/components/enc-base64.js"></script>
  <script src="sdk/lib/url-template/url-template.js"></script>
  <script src="sdk/lib/apiGatewayCore/sigV4Client.js"></script>
  <script src="sdk/lib/apiGatewayCore/apiGatewayClient.js"></script>
  <script src="sdk/lib/apiGatewayCore/simpleHttpClient.js"></script>
  <script src="sdk/lib/apiGatewayCore/utils.js"></script>
  <script src="sdk/apigClient.js"></script>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
